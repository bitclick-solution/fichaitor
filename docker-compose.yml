services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: fichaitor
      POSTGRES_PASSWORD: ${FICHAITOR_DB_OWNER_PASSWORD:-dev}
      POSTGRES_DB: fichaitor
    volumes:
      - db-data:/var/lib/postgresql/data
      # Solo se ejecutan al crear el volumen. Para reaplicar el esquema:
      #   docker compose exec -T db psql -U fichaitor -d fichaitor < db/schema.sql
      - ./db/schema.sql:/docker-entrypoint-initdb.d/10-schema.sql:ro
      - ./db/schema_worker.sql:/docker-entrypoint-initdb.d/15-schema-worker.sql:ro
      - ./db/schema_channels.sql:/docker-entrypoint-initdb.d/17-schema-channels.sql:ro
      - ./db/dev-init.sql:/docker-entrypoint-initdb.d/20-dev-init.sql:ro
      # Después de dev-init.sql: los roles de cobro y del backoffice ya existen.
      - ./db/schema_billing.sql:/docker-entrypoint-initdb.d/30-schema-billing.sql:ro
      - ./db/schema_admin.sql:/docker-entrypoint-initdb.d/40-schema-admin.sql:ro
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fichaitor -d fichaitor"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      FICHAITOR_FAKE_PLACES: ${FICHAITOR_FAKE_PLACES:-true}
      FICHAITOR_DATABASE_URL: ${FICHAITOR_DATABASE_URL:-postgresql://fichaitor_api_dev:dev@db:5432/fichaitor}
      # La API va detrás del nginx de `web`, que fija X-Forwarded-For. Sin esto todos los
      # visitantes comparten la IP del contenedor web y, con ella, los límites por IP.
      FICHAITOR_TRUST_PROXY_HEADERS: "true"
      # WhatsApp: la API recibe, nunca envía. El token se vacía aunque .env lo traiga.
      FICHAITOR_WHATSAPP_ACCESS_TOKEN: ""
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    read_only: true
    tmpfs:
      - /tmp
    # Un error de configuración no debe dejar el contenedor reiniciándose sin fin.
    restart: on-failure:3

  worker:
    build: .
    command: ["python", "-m", "app.worker"]
    env_file:
      - path: .env
        required: false
      # La clave privada de los tokens vive fuera del repositorio y solo la recibe el worker.
      - path: ../fichaitor-secretos/worker.env
        required: false
    environment:
      FICHAITOR_WORKER_DATABASE_URL: ${FICHAITOR_WORKER_DATABASE_URL:-postgresql://fichaitor_worker_dev:dev@db:5432/fichaitor}
    depends_on:
      db:
        condition: service_healthy
    # La imagen trae la comprobación HTTP de la API; el worker no escucha en ningún puerto.
    healthcheck:
      disable: true
    read_only: true
    tmpfs:
      - /tmp
    stop_grace_period: 130s
    restart: on-failure:3

  # La conversación por Telegram (docs/canales.md): otro proceso con la misma imagen y
  # su propio usuario de base de datos. No recibe la clave privada de los tokens.
  # Con FICHAITOR_TELEGRAM_POLLING=true en .env recibe por sondeo largo, sin URL pública.
  conversation:
    build: .
    command: ["python", "-m", "app.worker.conversation"]
    env_file:
      - path: .env
        required: false
    environment:
      FICHAITOR_CONVERSATION_DATABASE_URL: ${FICHAITOR_CONVERSATION_DATABASE_URL:-postgresql://fichaitor_conversation_dev:dev@db:5432/fichaitor}
      # Nunca la clave privada en este proceso: se vacía aunque .env la traiga.
      FICHAITOR_TOKEN_PRIVATE_KEY: ""
      # WhatsApp: la conversación envía; los secretos del webhook son de la API.
      FICHAITOR_WHATSAPP_APP_SECRET: ""
      FICHAITOR_WHATSAPP_VERIFY_TOKEN: ""
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      disable: true
    read_only: true
    tmpfs:
      - /tmp
    stop_grace_period: 40s
    restart: on-failure:3

  # El cobro (docs/admin-facturacion.md): Stripe en MODO DE PRUEBA y Odoo falso por defecto.
  # Sin env_file a propósito: de .env solo recibe lo suyo (Compose sustituye las ${...} con
  # .env), nunca la clave privada de los tokens ni los secretos de Google o Telegram.
  # Probar un pago en local: docs/despliegue.md, «Probar un pago en local». Perfil "cobro":
  # solo arranca con `docker compose --profile cobro up`.
  billing:
    build: .
    profiles: ["cobro"]
    command: ["python", "-m", "app.billing"]
    environment:
      FICHAITOR_BILLING_DATABASE_URL: ${FICHAITOR_BILLING_DATABASE_URL:-postgresql://fichaitor_billing_dev:dev@db:5432/fichaitor}
      # Una clave de prueba (rk_test_ o sk_test_). Sin ella, el Stripe falso.
      FICHAITOR_STRIPE_SECRET_KEY: ${FICHAITOR_STRIPE_SECRET_KEY:-}
      FICHAITOR_FAKE_STRIPE: ${FICHAITOR_FAKE_STRIPE:-false}
      # Nunca live en local.
      FICHAITOR_STRIPE_LIVEMODE: "false"
      FICHAITOR_FAKE_ODOO: ${FICHAITOR_FAKE_ODOO:-true}
      FICHAITOR_PUBLIC_BASE_URL: ${FICHAITOR_PUBLIC_BASE_URL:-http://localhost:8080}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      disable: true
    read_only: true
    tmpfs:
      - /tmp
    stop_grace_period: 250s
    restart: on-failure:3

  # Backoffice (docs/contrato-backoffice.md): solo en 127.0.0.1:8090, como en producción
  # por el túnel. Sin env_file: de .env solo recibe su clave de TOTP, su pimienta y su
  # authserv-id. Perfil "backoffice": `docker compose --profile backoffice up -d admin`.
  # Alta local: docker compose run --rm --entrypoint python admin scripts/admin_usuario.py ...
  admin:
    build: .
    profiles: ["backoffice"]
    command: ["python", "-m", "app.admin"]
    environment:
      FICHAITOR_ADMIN_DATABASE_URL: ${FICHAITOR_ADMIN_DATABASE_URL:-postgresql://fichaitor_admin_dev:dev@db:5432/fichaitor}
      FICHAITOR_ADMIN_TOTP_KEY: ${FICHAITOR_ADMIN_TOTP_KEY:-}
      FICHAITOR_ADMIN_PASSWORD_PEPPER: ${FICHAITOR_ADMIN_PASSWORD_PEPPER:-}
      FICHAITOR_ADMIN_AUTHSERV_ID: ${FICHAITOR_ADMIN_AUTHSERV_ID:-mx.ionos.es}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8090:8090"
    healthcheck:
      disable: true
    read_only: true
    tmpfs:
      - /tmp
    restart: on-failure:3

  # Sitio público y aplicación /app. Redirige /api/ a la API: mismo origen, sin CORS.
  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    depends_on:
      - api
    ports:
      - "127.0.0.1:8080:8080"
    restart: on-failure:3

volumes:
  db-data:
