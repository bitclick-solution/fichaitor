# Actualizaciones automáticas de dependencias. Dependabot abre un pull request
# por grupo y la CI (.github/workflows/ci.yml) lo valida.
version: 2
updates:
  # Acciones de GitHub usadas en los flujos (fijadas por commit).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      acciones:
        patterns: ["*"]
    commit-message:
      prefix: ci

  # Dependencias de Python: pyproject.toml y uv.lock.
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      python-menores:
        update-types: [minor, patch]
    commit-message:
      prefix: chore

  # Imágenes base del Dockerfile (python y uv).
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: chore

  # Imágenes de docker-compose.yml (postgres).
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: chore

  # Web: actívalo cuando exista web/package.json. Antes, Dependabot daría
  # un error por no encontrar el manifiesto.
