[project]
name = "fichaitor"
version = "0.1.0"
description = "Fichaitor: agente conversacional para la ficha de Google Business Profile"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "asyncpg>=0.29",
    "pynacl>=1.5",
    "python-multipart>=0.0.33",
    "cryptography>=50.0.2",
    "stripe>=17.0.0,<18",
    "pyotp>=2.9,<3",
    "argon2-cffi>=25.1,<26",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"
# web/ y brand/ son de la sesión de interfaz: aquí no se formatean ni se revisan.
extend-exclude = ["web", "brand"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
