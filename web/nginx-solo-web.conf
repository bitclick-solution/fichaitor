# Fichaitor — nginx del contenedor `web` en el modo «solo web»: portada y páginas legales, sin API detrás.
#
# Se activa con FICHAITOR_SOLO_WEB=true. Al arrancar, web/solo-web.sh copia este archivo encima de
# la configuración normal (web/nginx.conf), que no llega a cargarse: así nginx no intenta resolver
# el nombre de la API, que en este modo no existe.
#
# - La portada es la variante de web/site/_solo/index.html: sin conectar con Google, sin la prueba
#   con captura y sin la lista de espera (las tres necesitan la API).
# - /app y todo lo que cuelga de ella sirve la página «Muy pronto».
# - /api/ responde 503 sin intentar el reenvío.
# - /baja-comunicaciones (la baja de las comunicaciones comerciales) responde 404.
#
# Lo demás (registro, IP real, cabeceras, caché, páginas legales, 404) es igual que en web/nginx.conf:
# si cambias algo allí, mira si también va aquí.

set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

map $request_uri $ruta_pedida {
    "~^(?<ruta>[^?]*)" $ruta;
}
log_format fichaitor '$remote_addr [$time_local] "$request_method $ruta_pedida $server_protocol" $status $body_bytes_sent $request_time "$http_user_agent"';

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    access_log /var/log/nginx/access.log fichaitor;
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;
    gzip_min_length 1024;

    error_page 404 /404.html;
    absolute_redirect off;

    client_max_body_size 64k;
    client_body_buffer_size 16k;
    client_body_timeout 15s;

    # Sin API: nada se reenvía.
    location /api/ {
        include /etc/nginx/snippets/seguridad.conf;
        add_header Cache-Control "no-store" always;
        default_type application/json;
        return 503 '{"detail":"Fichaitor aún no está abierto."}';
    }

    # Portada de este modo.
    location = / {
        include /etc/nginx/snippets/seguridad.conf;
        add_header Cache-Control "no-cache" always;
        root /usr/share/nginx/solo;
        try_files /index.html =404;
    }
    # La portada normal (con las llamadas a la API) no se sirve por su nombre.
    location = /index.html {
        include /etc/nginx/snippets/seguridad.conf;
        return 301 /;
    }

    # La aplicación necesita la API: «Muy pronto» en /app y en cualquier ruta suya.
    location = /app {
        include /etc/nginx/snippets/seguridad.conf;
        add_header Cache-Control "no-cache" always;
        root /usr/share/nginx/solo;
        try_files /app.html =404;
    }
    location /app/ {
        include /etc/nginx/snippets/seguridad.conf;
        add_header Cache-Control "no-cache" always;
        root /usr/share/nginx/solo;
        try_files /app.html =404;
    }

    # La baja de las comunicaciones necesita la API y en este modo no se envía ningún correo
    # comercial: la página y su script no existen (404 con la página de la marca). ^~ cubre
    # /baja-comunicaciones, /baja-comunicaciones/, su index.html y /baja-comunicaciones.js.
    location ^~ /baja-comunicaciones {
        include /etc/nginx/snippets/seguridad.conf;
        return 404;
    }

    location = /404.html {
        internal;
        include /etc/nginx/snippets/seguridad.conf;
        add_header Cache-Control "no-cache" always;
    }

    location = /manifest.webmanifest {
        include /etc/nginx/snippets/seguridad.conf;
        add_header Cache-Control "no-cache" always;
        default_type application/manifest+json;
        try_files $uri =404;
    }

    location /fonts/ {
        include /etc/nginx/snippets/seguridad.conf;
        add_header Cache-Control "public, max-age=2592000" always;
        try_files $uri =404;
    }
    location = /privacidad {
        include /etc/nginx/snippets/seguridad.conf;
        return 301 /privacidad/;
    }
    location = /condiciones-de-uso {
        include /etc/nginx/snippets/seguridad.conf;
        return 301 /condiciones-de-uso/;
    }
    location / {
        include /etc/nginx/snippets/seguridad.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri ${uri}index.html =404;
    }
}
