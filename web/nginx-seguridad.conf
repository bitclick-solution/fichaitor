# Cabeceras de seguridad de Fichaitor. Se incluye en CADA location de nginx.conf.
#
# Por qué un archivo aparte: en nginx, un add_header dentro de una location anula todos los
# add_header heredados del bloque server. Como cada location fija su Cache-Control, las cabeceras
# puestas a nivel de server no salían en ninguna respuesta (comprobado el 2026-11-12).

# Política de contenido: todo sale de nuestro dominio.
# - script-src: el único script en línea es el de la portada que añade la clase «js»; va por su hash.
#   Si se cambia ese script en web/src/index.html, hay que recalcular el hash:
#     printf '%s' 'document.documentElement.classList.add("js")' | openssl dgst -sha256 -binary | openssl base64
# - img-src data: la aplicación lleva el logo en línea como data:image/svg+xml (lo hace Vite).
# - style-src sin 'unsafe-inline': no hay atributos style en el HTML servido. Los estilos que ponen
#   los scripts (element.style) no cuentan como en línea.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-qOhFsq0QMV2REqNwk5hGH5bZE9SkX6gt6yeyKdYPv+U='; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

# HTTPS obligatorio un año. Los navegadores lo ignoran si la respuesta llega por http (desarrollo).
add_header Strict-Transport-Security "max-age=31536000" always;

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
