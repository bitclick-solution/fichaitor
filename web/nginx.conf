# Fichaitor — nginx del contenedor `web`. Va detrás del Nginx Proxy Manager, que termina TLS.
# Mismo origen para la web y la API: sin CORS.
#
# Es una plantilla: al arrancar, la imagen sustituye ${API_UPSTREAM} (por defecto `api:8000`).
# En producción se fija a un nombre único en la red compartida con el proxy, para que no
# choque con otro servicio que también se llame `api`.
#
# Las cabeceras de seguridad están en /etc/nginx/snippets/seguridad.conf (web/nginx-seguridad.conf)
# y se incluyen en cada location: ver la nota de ese archivo.

# IP real del visitante. Delante solo hay proxies de redes privadas de Docker (Nginx Proxy
# Manager), que añaden la IP del cliente al final de X-Forwarded-For. Se toma la dirección
# más a la derecha que no sea de una red privada, así que un valor falsificado por el
# cliente no cuenta.
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

# Registro sin la cadena de consulta ni el Referer: por ahí viajan el código de autorización
# de Google (?code=) y el enlace de restauración de la baja (?restaurar=), que no deben quedar
# guardados en los registros.
log_format fichaitor '$remote_addr [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent $request_time "$http_user_agent"';

# Límites por IP (ya es la del visitante, tras real_ip) y totales.
limit_req_zone $binary_remote_addr zone=api_ip:2m rate=10r/s;
limit_req_zone $binary_remote_addr zone=captura_ip:1m rate=6r/m;
limit_conn_zone $binary_remote_addr zone=captura_conn_ip:1m;
limit_conn_zone $server_name zone=captura_conn_total:1m;
limit_req_status 429;
limit_conn_status 429;

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    access_log /var/log/nginx/access.log fichaitor;

    # No revelar la versión
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;
    gzip_min_length 1024;

    # Cuerpos pequeños por defecto: la API solo recibe JSON breve, salvo la captura.
    client_max_body_size 64k;
    client_body_timeout 15s;

    # Captura de la prueba de reseñas: el único envío grande.
    # Cada subida se queda en memoria (la política dice que se procesa en memoria) y la memoria
    # está acotada: como mucho 8 subidas a la vez de 7 MB, 2 por visitante. El contenedor tiene 96 MB.
    location = /api/v1/public/diagnosis/screenshot {
        include /etc/nginx/snippets/seguridad.conf;
        add_header Cache-Control "no-store" always;
        client_max_body_size 7m;
        client_body_buffer_size 7m;
        limit_conn captura_conn_ip 2;
        limit_conn captura_conn_total 8;
        limit_req zone=captura_ip burst=3 nodelay;
        proxy_pass http://${API_UPSTREAM};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 60s;
    }

    # Webhooks de Telegram y, más adelante, WhatsApp: llegan desde unas pocas IP del proveedor,
    # así que no llevan el límite por IP (tendrían 429 con volumen). Los protege el secreto del
    # webhook, que comprueba la API. Mantienen el tope de 64 KB por petición.
    location ^~ /api/v1/webhooks/ {
        include /etc/nginx/snippets/seguridad.conf;
        add_header Cache-Control "no-store" always;
        proxy_pass http://${API_UPSTREAM};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 30s;
    }

    # API: se reenvía tal cual, con la ruta completa /api/...
    location /api/ {
        include /etc/nginx/snippets/seguridad.conf;
        add_header Cache-Control "no-store" always;
        limit_req zone=api_ip burst=30 nodelay;
        proxy_pass http://${API_UPSTREAM};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Una sola IP, ya saneada: la API no tiene que interpretar una cadena de proxies.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 30s;
    }

    # Aplicación: Google devuelve a /app?google=...; se sirve sin redirigir para no perder los parámetros
    location = /app {
        include /etc/nginx/snippets/seguridad.conf;
        add_header Cache-Control "no-cache" always;
        try_files /app/index.html =404;
    }
    location /app/ {
        include /etc/nginx/snippets/seguridad.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri /app/index.html;
    }
    # Los archivos compilados llevan huella en el nombre
    location /app/assets/ {
        include /etc/nginx/snippets/seguridad.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Sitio público: sin respaldo a index.html, lo que no existe es un 404
    location /fonts/ {
        include /etc/nginx/snippets/seguridad.conf;
        add_header Cache-Control "public, max-age=2592000" always;
        try_files $uri =404;
    }
    location / {
        include /etc/nginx/snippets/seguridad.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ =404;
    }
}
