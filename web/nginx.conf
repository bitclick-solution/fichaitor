# Fichaitor — nginx del contenedor `web`. Va detrás del Nginx Proxy Manager, que termina TLS.
# Mismo origen para la web y la API: sin CORS.
#
# Es una plantilla: al arrancar, la imagen sustituye ${API_UPSTREAM} (por defecto `api:8000`).
# En producción se fija a un nombre único en la red compartida con el proxy, para que no
# choque con otro servicio que también se llame `api`.

# IP real del visitante. Delante solo hay proxies de redes privadas de Docker (Nginx Proxy
# Manager), que añaden la IP del cliente al final de X-Forwarded-For. Se toma la dirección
# más a la derecha que no sea de una red privada, así que un valor falsificado por el
# cliente no cuenta.
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    # No revelar la versión
    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;
    gzip_min_length 1024;

    # API: se reenvía tal cual, con la ruta completa /api/...
    location /api/ {
        proxy_pass http://${API_UPSTREAM};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Una sola IP, ya saneada: la API no tiene que interpretar una cadena de proxies.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 60s;
        # La captura del diagnóstico se sube como imagen (el navegador la reduce antes; tope de la web: 8 MB)
        client_max_body_size 10m;
        # El cuerpo se queda en memoria: sin esto, nginx escribe la captura en un archivo temporal
        # antes de pasarla a la API, y la política dice que se procesa en memoria.
        client_body_buffer_size 10m;
        add_header Cache-Control "no-store" always;
    }

    # Aplicación: Google devuelve a /app?google=...; se sirve sin redirigir para no perder los parámetros
    location = /app {
        try_files /app/index.html =404;
        add_header Cache-Control "no-cache" always;
    }
    location /app/ {
        try_files $uri /app/index.html;
        add_header Cache-Control "no-cache" always;
    }
    # Los archivos compilados llevan huella en el nombre
    location /app/assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # Sitio público: sin respaldo a index.html, lo que no existe es un 404
    location /fonts/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=2592000" always;
    }
    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache" always;
    }
}
