# Fichaitor — nginx del contenedor `web`. Va detrás del Nginx Proxy Manager, que termina TLS.
# Mismo origen para la web y la API: sin CORS.
#
# Es una plantilla: al arrancar, la imagen sustituye ${API_UPSTREAM} (por defecto `api:8000`).
# En producción se fija a un nombre único en la red compartida con el proxy, para que no
# choque con otro servicio que también se llame `api`.
#
# Las cabeceras de seguridad están en /etc/nginx/snippets/seguridad.conf (web/nginx-seguridad.conf)
# y se incluyen en cada location: ver la nota de ese archivo.

# IP real del visitante. Delante solo hay proxies de redes privadas de Docker (Nginx Proxy
# Manager), que añaden la IP del cliente al final de X-Forwarded-For. Se toma la dirección
# más a la derecha que no sea de una red privada, así que un valor falsificado por el
# cliente no cuenta.
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

# Registro sin la cadena de consulta ni el Referer: por ahí viajan el código de autorización
# de Google (?code=) y el enlace de restauración de la baja (?restaurar=), que no deben quedar
# guardados en los registros.
# Se registra la ruta pedida por el visitante ($request_uri sin la consulta), no la interna
# ($uri): con $uri, un 404 aparecía como /404.html y cualquier ruta de la app como /app/index.html.
map $request_uri $ruta_pedida {
    "~^(?<ruta>[^?]*)" $ruta;
}
log_format fichaitor '$remote_addr [$time_local] "$request_method $ruta_pedida $server_protocol" $status $body_bytes_sent $request_time "$http_user_agent"';

# Límites por IP (ya es la del visitante, tras real_ip) y totales.
limit_req_zone $binary_remote_addr zone=api_ip:2m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=api_conn_ip:2m;
limit_req_zone $binary_remote_addr zone=captura_ip:1m rate=6r/m;
limit_conn_zone $binary_remote_addr zone=captura_conn_ip:1m;
limit_conn_zone $server_name zone=captura_conn_total:1m;
# Webhooks (I10): Telegram envía desde pocas IP, así que el límite por IP es alto.
limit_req_zone $binary_remote_addr zone=webhook_ip:1m rate=30r/s;
limit_conn_zone $binary_remote_addr zone=webhook_conn_ip:1m;
limit_req_status 429;
limit_conn_status 429;

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    access_log /var/log/nginx/access.log fichaitor;

    # No revelar la versión
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;
    gzip_min_length 1024;

    # Página 404 con la marca para lo que no existe en el sitio y en /app/assets/.
    # Los errores de la API no pasan por aquí: proxy_intercept_errors sigue desactivado
    # (valor por defecto), así que un 404 de la API llega tal cual, en JSON.
    error_page 404 /404.html;

    # Redirecciones relativas. Con absolutas, nginx usaba su propio
    # esquema y puerto (http://fichaitor.es:8080/...), que no existen detrás del proxy.
    absolute_redirect off;

    # Cuerpos pequeños por defecto: la API solo recibe JSON breve, salvo la captura.
    client_max_body_size 64k;
    client_body_buffer_size 16k;
    client_body_timeout 15s;

    # Captura de la prueba de reseñas: el único envío grande.
    # nginx no la guarda: la pasa a la API según llega (proxy_request_buffering off), con un
    # búfer de 64 KB y sin escribir nada en disco (la política dice que se procesa en memoria).
    # Así la memoria de este contenedor (96 MB) no depende del tamaño de las subidas, y la API
    # puede rechazar a un visitante que ha pasado su límite antes de leer el cuerpo.
    # Como mucho 8 subidas a la vez, 2 por visitante.
    location = /api/v1/public/diagnosis/screenshot {
        include /etc/nginx/snippets/seguridad.conf;
        add_header Cache-Control "no-store" always;
        client_max_body_size 7m;
        client_body_buffer_size 64k;
        proxy_request_buffering off;
        limit_conn captura_conn_ip 2;
        limit_conn captura_conn_total 8;
        limit_req zone=captura_ip burst=3 nodelay;
        proxy_pass http://${API_UPSTREAM};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 60s;
    }

    # Webhooks de Telegram y, más adelante, WhatsApp: llegan desde unas pocas IP del proveedor,
    # así que su límite por IP es alto (Telegram abre hasta 40 conexiones). Los protege el
    # secreto del webhook, que comprueba la API. Tope de 64 KB por petición.
    location ^~ /api/v1/webhooks/ {
        include /etc/nginx/snippets/seguridad.conf;
        add_header Cache-Control "no-store" always;
        client_max_body_size 64k;
        limit_req zone=webhook_ip burst=100 nodelay;
        limit_conn webhook_conn_ip 50;
        proxy_pass http://${API_UPSTREAM};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 30s;
    }

    # Vuelta de Google tras conectar: la URL lleva el código de autorización (?code=). Si la API
    # fallara, nginx anotaría la petición entera en el registro de errores; aquí solo lo crítico.
    location = /api/v1/google/oauth/callback {
        include /etc/nginx/snippets/seguridad.conf;
        add_header Cache-Control "no-store" always;
        error_log /var/log/nginx/error.log crit;
        limit_req zone=api_ip burst=30 nodelay;
        # Peticiones a la vez por visitante: las lentas no acaparan la API.
        limit_conn api_conn_ip 10;
        proxy_pass http://${API_UPSTREAM};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 30s;
    }

    # API: se reenvía tal cual, con la ruta completa /api/...
    location /api/ {
        include /etc/nginx/snippets/seguridad.conf;
        add_header Cache-Control "no-store" always;
        limit_req zone=api_ip burst=30 nodelay;
        # Peticiones a la vez por visitante: las lentas no acaparan la API.
        limit_conn api_conn_ip 10;
        proxy_pass http://${API_UPSTREAM};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Una sola IP, ya saneada: la API no tiene que interpretar una cadena de proxies.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 30s;
    }

    # Aplicación: Google devuelve a /app?google=...; se sirve sin redirigir para no perder los parámetros
    location = /app {
        include /etc/nginx/snippets/seguridad.conf;
        add_header Cache-Control "no-cache" always;
        try_files /app/index.html =404;
    }
    location /app/ {
        include /etc/nginx/snippets/seguridad.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri /app/index.html;
    }
    # Los archivos compilados llevan huella en el nombre
    location /app/assets/ {
        include /etc/nginx/snippets/seguridad.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Solo se llega por error_page: pedida directamente, también responde 404 con la página.
    location = /404.html {
        internal;
        include /etc/nginx/snippets/seguridad.conf;
        add_header Cache-Control "no-cache" always;
    }

    # Manifiesto de la web instalable. El mime.types de la imagen no conoce .webmanifest
    # (lo serviría como application/octet-stream). Se fija aquí con default_type, no con un
    # bloque types {}, que reemplazaría todos los tipos.
    location = /manifest.webmanifest {
        include /etc/nginx/snippets/seguridad.conf;
        add_header Cache-Control "no-cache" always;
        default_type application/manifest+json;
        try_files $uri =404;
    }

    # Sitio público: sin respaldo a index.html, lo que no existe es un 404
    location /fonts/ {
        include /etc/nginx/snippets/seguridad.conf;
        add_header Cache-Control "public, max-age=2592000" always;
        try_files $uri =404;
    }
    # Las páginas legales sin barra final llevan a su dirección con barra (relativa: absolute_redirect off).
    location = /privacidad {
        include /etc/nginx/snippets/seguridad.conf;
        return 301 /privacidad/;
    }
    location = /condiciones-de-uso {
        include /etc/nginx/snippets/seguridad.conf;
        return 301 /condiciones-de-uso/;
    }
    # Baja de las comunicaciones comerciales: el enlace de los correos va sin barra final
    # (/baja-comunicaciones#<token>) y se sirve tal cual, sin redirigir. Con barra también
    # funciona, por la location /. El token va en el fragmento: nunca llega aquí ni al registro.
    location = /baja-comunicaciones {
        include /etc/nginx/snippets/seguridad.conf;
        add_header Cache-Control "no-cache" always;
        try_files /baja-comunicaciones/index.html =404;
    }
    # Sin el módulo de índice ($uri/): un directorio sin index.html es un 404 más, no un 403 con la
    # petición completa (y su consulta) en el registro de errores.
    location / {
        include /etc/nginx/snippets/seguridad.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri ${uri}index.html =404;
    }
}
